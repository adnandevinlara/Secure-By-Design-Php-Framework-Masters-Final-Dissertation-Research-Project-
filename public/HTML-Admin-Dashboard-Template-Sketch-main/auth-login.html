<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <title>
   Login | Admin &amp; Dashboard Template
  </title>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <meta content="Premium Multipurpose Admin &amp; Dashboard Template" name="description">
   <meta content="Themesbrand" name="author"/>
   <!-- App favicon -->
   <link href="assets/images/favicon.ico" rel="shortcut icon"/>
   <!-- Bootstrap Css -->
   <link href="assets/css/bootstrap.min.css" id="bootstrap-style" rel="stylesheet" type="text/css">
    <!-- Icons Css -->
    <link href="assets/css/icons.min.css" rel="stylesheet" type="text/css"/>
    <!-- App Css-->
    <link href="assets/css/app.min.css" id="app-style" rel="stylesheet" type="text/css"/>
    <!-- App js -->
    <script src="assets/js/plugin.js">
    </script>
   </link>
  </meta>
 </head>
 <body>
  <div class="account-pages my-5 pt-sm-5">
   <div class="container">
    <div class="row justify-content-center">
     <div class="col-md-8 col-lg-6 col-xl-5">
      <div class="card overflow-hidden">
       <div class="bg-primary-subtle">
        <div class="row">
         <div class="col-7">
          <div class="text-primary p-4">
           <h5 class="text-primary">
            Welcome Back !
           </h5>
           <p>
            Sign in to continue to Skote.
           </p>
          </div>
         </div>
         <div class="col-5 align-self-end">
          <img alt="" class="img-fluid" src="assets/images/profile-img.png"/>
         </div>
        </div>
       </div>
       <div class="card-body pt-0">
        <div class="auth-logo">
         <a class="auth-logo-light" href="index.html">
          <div class="avatar-md profile-user-wid mb-4">
           <span class="avatar-title rounded-circle bg-light">
            <img alt="" class="rounded-circle" height="34" src="assets/images/logo-light.svg"/>
           </span>
          </div>
         </a>
         <a class="auth-logo-dark" href="index.html">
          <div class="avatar-md profile-user-wid mb-4">
           <span class="avatar-title rounded-circle bg-light">
            <img alt="" class="rounded-circle" height="34" src="assets/images/logo.svg"/>
           </span>
          </div>
         </a>
        </div>
        <div class="p-2">
         <form action="index.html" class="form-horizontal">
          <div class="mb-3">
           <label class="form-label" for="username">
            Username
           </label>
           <input class="form-control" id="username" placeholder="Enter username" type="text"/>
          </div>
          <div class="mb-3">
           <label class="form-label">
            Password
           </label>
           <div class="input-group auth-pass-inputgroup">
            <input aria-describedby="password-addon" aria-label="Password" class="form-control" placeholder="Enter password" type="password"/>
            <button class="btn btn-light" id="password-addon" type="button">
             <i class="mdi mdi-eye-outline">
             </i>
            </button>
           </div>
          </div>
          <div class="form-check">
           <input class="form-check-input" id="remember-check" type="checkbox"/>
           <label class="form-check-label" for="remember-check">
            Remember me
           </label>
          </div>
          <div class="mt-3 d-grid">
           <button class="btn btn-primary waves-effect waves-light" type="submit">
            Log In
           </button>
          </div>
          <div class="mt-4 text-center">
           <h5 class="font-size-14 mb-3">
            Sign in with
           </h5>
           <ul class="list-inline">
            <li class="list-inline-item">
             <a class="social-list-item bg-primary text-white border-primary" href="javascript::void()">
              <i class="mdi mdi-facebook">
              </i>
             </a>
            </li>
            <li class="list-inline-item">
             <a class="social-list-item bg-info text-white border-info" href="javascript::void()">
              <i class="mdi mdi-twitter">
              </i>
             </a>
            </li>
            <li class="list-inline-item">
             <a class="social-list-item bg-danger text-white border-danger" href="javascript::void()">
              <i class="mdi mdi-google">
              </i>
             </a>
            </li>
           </ul>
          </div>
          <div class="mt-4 text-center">
           <a class="text-muted" href="auth-recoverpw.html">
            <i class="mdi mdi-lock me-1">
            </i>
            Forgot your password?
           </a>
          </div>
         </form>
        </div>
       </div>
      </div>
      <div class="mt-5 text-center">
       <div>
        <p>
         Don't have an account ?
         <a class="fw-medium text-primary" href="auth-register.html">
          Signup now
         </a>
        </p>
        <p>
         Â©
         <script>
          document.write(new Date().getFullYear())
         </script>
         Skote. Crafted with
         <i class="mdi mdi-heart text-danger">
         </i>
         by Themesbrand
        </p>
       </div>
      </div>
     </div>
    </div>
   </div>
  </div>
  <!-- end account-pages -->
  <!-- JAVASCRIPT -->
  <script src="assets/libs/jquery/jquery.min.js">
  </script>
  <script src="assets/libs/bootstrap/js/bootstrap.bundle.min.js">
  </script>
  <script src="assets/libs/metismenu/metisMenu.min.js">
  </script>
  <script src="assets/libs/simplebar/simplebar.min.js">
  </script>
  <script src="assets/libs/node-waves/waves.min.js">
  </script>
  <!-- App js -->
  <script src="assets/js/app.js">
  </script>
 </body>
</html>
